<header class="top-header">

    <div class="logo-container" routerLink="/portal">
        <div class="logo-icon">T</div>
        <span class="logo-name">Tessitura</span>
    </div>

    <nav class="main-nav">
        <a routerLink="/helpdesk" routerLinkActive="active">Helpdesk</a>
        <a routerLink="/kyc/client" routerLinkActive="active">KYC</a>
        <a routerLink="/admin/users" routerLinkActive="active">Admin</a>
    </nav>

    <div class="user-profile">
        <div class="avatar">{{ userName?.charAt(0)?.toUpperCase() || 'U' }}</div>
        <span class="user-name">{{ userName }}</span>
        <button class="logout-btn" (click)="logout()" title="Sair do sistema" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </button>
    </div>

</header>
