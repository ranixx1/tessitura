<div class="select-field">
  @if (label) {
    <label [for]="id">
      {{ label }}

      @if (required) {
        <span class="select-field__required">*</span>
      }
    </label>
  }

  <select
    [id]="id"
    [name]="name"
    [disabled]="disabled"
    [required]="required"
    (change)="onChangeEvent($event)"
    (blur)="onBlur()"
  >
    <option value="" [selected]="!value">
      {{ placeholder }}
    </option>

    @for (option of options; track option.value) {
      <option
        [value]="option.value"
        [selected]="option.value === value"
      >
        {{ option.label }}
      </option>
    }
  </select>

  @if (error) {
    <span class="select-field__error">
      {{ error }}
    </span>
  }
</div>
