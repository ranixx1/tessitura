<div class="helpdesk-page">

  <header class="helpdesk-header">
    <div>
      <h1>Helpdesk</h1>
      <p>
        Gerencie seus chamados e solicite suporte.
      </p>
    </div>
  </header>

  <section class="helpdesk-actions">

    <a
      routerLink="/portal"
      class="helpdesk-card"
    >
      <span class="helpdesk-card-icon">+</span>

      <div>
        <h2>Abrir chamado</h2>
        <p>
          Solicite suporte através dos portais disponíveis.
        </p>
      </div>

      <span class="helpdesk-card-arrow">→</span>
    </a>

    <a
      routerLink="/helpdesk/chamados"
      class="helpdesk-card"
    >
      <span class="helpdesk-card-icon">≡</span>

      <div>
        <h2>Ver chamados</h2>
        <p>
          Consulte e acompanhe os chamados disponíveis.
        </p>
      </div>

      <span class="helpdesk-card-arrow">→</span>
    </a>

  </section>

</div>
