<div class="forgot-password-page">
  <app-card class="forgot-password-card">
    <div class="forgot-password-header">
      <h1>Esqueci minha senha</h1>

      <p>
        Informe seu username ou e-mail e sua data de nascimento
        para recuperar sua conta.
      </p>
    </div>

    @if (errorMessage) {
      <app-alert
        type="error"
        [message]="errorMessage"
      />
    }

    @if (successMessage) {
      <app-alert
        type="success"
        [message]="successMessage"
      />
    }

    <form
      [formGroup]="forgotPasswordForm"
      (ngSubmit)="onSubmit()"
    >
      <app-input
        label="Username ou e-mail"
        type="text"
        formControlName="reset"
        placeholder="Digite seu username ou e-mail"
      />

      <app-input
        label="Data de nascimento"
        type="date"
        formControlName="birthDate"
      />

      <app-button
        type="submit"
        [disabled]="forgotPasswordForm.invalid || loading"
      >
        @if (loading) {
          <app-loading />
        } @else {
          Recuperar senha
        }
      </app-button>
    </form>

    <div class="back-to-login">
      <a routerLink="/login">
        Voltar para o login
      </a>
    </div>
  </app-card>
</div>
