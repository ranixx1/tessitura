<div class="login-page">

  <app-card>

    <h1>Sign In</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <app-input id="login" name="login" label="Username" placeholder="Username" formControlName="login"
        autocomplete="username" [required]="true" />

      <app-input id="password" name="password" label="Password" type="password" placeholder="Password"
        formControlName="password" autocomplete="current-password" [required]="true" />

      <div class="forgot-password">
        <a routerLink="/forgot-password">Forgot your password?</a>
      </div>

      <app-alert type="error" [message]="errorMessage" />

      <app-button type="submit" [loading]="loading">
        Sign In
      </app-button>
    </form>

  </app-card>

  <div class="footer">
    <span>Don't have an account?</span>
    <a routerLink="/register">Create one</a>
  </div>
</div>
